name: probe-anv

on:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, 'probe-output') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Probe anv.to session
        run: |
          set -x
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          BASE='https://anv.to'
          WATCH="$BASE/anime/frieren-beyond-journey-s-end-c6fbj-episode-1"
          {
          echo "===== 1. root page headers (cookie jar) ====="
          curl -sS -o /dev/null -D - -c jar.txt -A "$UA" \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Site: none' -H 'Sec-Fetch-Dest: document' \
            -H 'Upgrade-Insecure-Requests: 1' "$BASE/"
          echo "===== jar after root ====="
          cat jar.txt

          echo "===== 2. watch page headers ====="
          curl -sS -o watch.html -D - -b jar.txt -c jar.txt -A "$UA" \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-Site: same-origin' -H 'Sec-Fetch-Dest: document' \
            -H 'Upgrade-Insecure-Requests: 1' -H "Referer: $BASE/" "$WATCH"
          echo "===== jar after watch ====="
          cat jar.txt
          echo "watch html size: $(wc -c < watch.html)"

          echo "===== 3. cookies seen in html/js ====="
          grep -o 'shiro_watch' watch.html | head -3
          grep -o 'shiro_[a-z_]*' watch.html | sort -u | head -10

          echo "===== 4. POST /api/episode with jar ====="
          curl -sS -D - -b jar.txt -c jar.txt -A "$UA" \
            -H 'Content-Type: application/json' -H 'Accept: */*' \
            -H "Origin: $BASE" -H "Referer: $WATCH" \
            -H 'Sec-Fetch-Mode: cors' -H 'Sec-Fetch-Site: same-origin' -H 'Sec-Fetch-Dest: empty' \
            --data '{"anilistId":1000006351,"malId":52991,"episode":1,"first":true,"prefer":"sub"}' \
            "$BASE/api/episode"
          echo
          echo "===== 5. POST /api/episode, xhr flavour ====="
          curl -sS -o /dev/null -w 'code=%{http_code}\n' -b jar.txt -A "$UA" \
            -H 'Content-Type: application/json' -H 'Accept: */*' \
            -H "Origin: $BASE" -H "Referer: $WATCH" \
            -H 'X-Requested-With: XMLHttpRequest' \
            --data '{"anilistId":1000006351,"episode":1}' "$BASE/api/episode"

          echo "===== 6. GET /api/episode ====="
          curl -sS -o - -w '\ncode=%{http_code}\n' -b jar.txt -A "$UA" \
            -H "Referer: $WATCH" "$BASE/api/episode?anilistId=1000006351&episode=1"

          echo "===== 7. HEAD watch page ====="
          curl -sS -o /dev/null -D - -I -A "$UA" -H 'Accept: text/html' "$WATCH"

          echo "===== 8. random slug watch page headers ====="
          curl -sS -o /dev/null -D - -c jar2.txt -A "$UA" -H 'Accept: text/html' "$BASE/anime/one-piece-odmau-episode-1"
          cat jar2.txt

          echo "===== 9. POST /api/episode one piece with jar2 ====="
          curl -sS -w '\ncode=%{http_code}\n' -b jar2.txt -A "$UA" \
            -H 'Content-Type: application/json' -H "Origin: $BASE" \
            -H "Referer: $BASE/anime/one-piece-odmau-episode-1" \
            --data '{"anilistId":1000001642,"malId":21,"episode":1,"first":true}' "$BASE/api/episode"

          echo "===== 10. POST with explicit dummy shiro_watch cookie ====="
          curl -sS -w '\ncode=%{http_code}\n' -A "$UA" \
            -H 'Content-Type: application/json' -H "Origin: $BASE" -H "Referer: $WATCH" \
            -H 'Cookie: shiro_watch=abc123' \
            --data '{"anilistId":1000006351,"episode":1}' "$BASE/api/episode"

          echo "===== 11. site html: next build id / api hints ====="
          grep -o '/_next/static/chunks/[a-zA-Z0-9._/-]*\.js' watch.html | sort -u | head -12
          } > anv-probe.txt 2>&1
          echo done

      - name: Commit probe output
        run: |
          git config user.name "arena-probe"
          git config user.email "probe@arena.local"
          git add anv-probe.txt
          git commit -m "probe-output: anv session probe"
          git push
