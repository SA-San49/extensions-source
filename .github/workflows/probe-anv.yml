name: probe-anv

on:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, 'probe-output') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Probe filters
        run: |
          python3 - > anv-probe.txt 2>&1 <<'PY'
          import json, urllib.request, urllib.error

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          BASE = "https://anv.to"

          def catalog(op, variables):
              req = urllib.request.Request(
                  BASE + "/api/catalog",
                  data=json.dumps({"operation": op, "variables": variables}).encode(),
                  headers={"User-Agent": UA, "Content-Type": "application/json",
                           "Accept": "application/json", "Origin": BASE, "Referer": BASE + "/"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.loads(e.read())
                  except Exception:
                      return e.code, None
              except Exception as e:
                  return -1, repr(e)

          def probe(label, variables):
              st, j = catalog("BrowseAnime", variables)
              if isinstance(j, dict) and j.get("data"):
                  page = j["data"].get("Page") or {}
                  media = page.get("media") or []
                  print(f"{label:52s} -> {st} total={page.get('pageInfo', {}).get('total')} n={len(media)} first={(media[0].get('title') or {}).get('english') if media else None}")
                  return media
              print(f"{label:52s} -> {st} {str(j)[:160]}")
              return []

          print("== sort values ==")
          for s in ["TRENDING_DESC", "POPULARITY_DESC", "SCORE_DESC", "START_DATE_DESC",
                    "UPDATED_AT_DESC", "FAVOURITES_DESC", "TITLE_ROMAJI", "EPISODES_DESC"]:
              probe(f"sort={s}", {"sort": [s], "page": 1, "perPage": 2})

          print("\n== search + sort ==")
          probe("search+sort", {"search": "one piece", "sort": ["SCORE_DESC"], "page": 1, "perPage": 3})
          probe("search only", {"search": "one piece", "page": 1, "perPage": 3})

          print("\n== formats ==")
          for f in ["TV", "TV_SHORT", "MOVIE", "SPECIAL", "OVA", "ONA", "MUSIC"]:
              probe(f"format={f}", {"format": f, "page": 1, "perPage": 2})

          print("\n== statuses ==")
          for s in ["FINISHED", "RELEASING", "NOT_YET_RELEASED", "CANCELLED", "HIATUS"]:
              probe(f"status={s}", {"status": s, "page": 1, "perPage": 2})

          print("\n== seasons ==")
          for season, year in [("WINTER", 2025), ("SPRING", 2025), ("SUMMER", 2025), ("FALL", 2025), ("FALL", 2026)]:
              probe(f"season={season} {year}", {"season": season, "seasonYear": year, "page": 1, "perPage": 2})

          print("\n== isAdult ==")
          probe("isAdult=false", {"isAdult": False, "page": 1, "perPage": 2})
          probe("isAdult=true", {"isAdult": True, "page": 1, "perPage": 2})

          print("\n== genres ==")
          for g in ["Action", "Adventure", "Comedy", "Drama", "Ecchi", "Fantasy", "Horror",
                    "Mahou Shoujo", "Mecha", "Music", "Mystery", "Psychological", "Romance",
                    "Sci-Fi", "Slice of Life", "Sports", "Supernatural", "Thriller", "Hentai"]:
              probe(f"genre={g}", {"genres": [g], "page": 1, "perPage": 2})

          print("\n== perPage limits ==")
          for n in [24, 30, 50, 100]:
              probe(f"perPage={n}", {"page": 1, "perPage": n})

          print("\n== combined ==")
          probe("combo", {"search": "leveling", "genres": ["Action"], "format": "TV",
                          "status": "FINISHED", "sort": ["SCORE_DESC"], "season": "WINTER",
                          "seasonYear": 2024, "page": 1, "perPage": 5})

          print("\n== movie episode api ==")
          movies = probe("movies", {"format": "MOVIE", "sort": ["SCORE_DESC"], "page": 1, "perPage": 3})
          if movies:
              m = movies[0]
              print("movie:", m["slug"], m["id"], m.get("idMal"), m.get("episodes"), m.get("duration"))
              # detail to see streamingEpisodes for movie
              st, j = catalog("AnimeDetail", {"slug": m["slug"]})
              media = (j.get("data") or {}).get("Media") if isinstance(j, dict) else None
              if media:
                  print("movie detail episodes:", media.get("episodes"),
                        "nextAiring:", media.get("nextAiringEpisode"),
                        "streaming:", len(media.get("streamingEpisodes") or []),
                        "format:", media.get("format"))
          PY

      - name: Fetch site icon
        run: |
          python3 - > icon-probe.txt 2>&1 <<'PY'
          import re, urllib.request
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          html = urllib.request.urlopen(urllib.request.Request("https://anv.to/", headers={"User-Agent": UA}), timeout=45).read().decode("utf-8", "replace")
          links = re.findall(r'<link[^>]+(?:rel="(?:icon|apple-touch-icon|shortcut icon)"|href="[^"]*\.(?:png|svg|ico)")[^>]*>', html)
          print("icon links:", links[:10])
          urls = []
          for l in links:
              m = re.search(r'href="([^"]+)"', l)
              if m:
                  urls.append(m.group(1))
          urls += ["/favicon.ico", "/icon.png", "/apple-touch-icon.png", "/brand/blob.svg"]
          seen = set()
          for u in urls:
              if u in seen:
                  continue
              seen.add(u)
              full = u if u.startswith("http") else "https://anv.to" + ("" if u.startswith("/") else "/") + u
              try:
                  with urllib.request.urlopen(urllib.request.Request(full, headers={"User-Agent": UA}), timeout=45) as r:
                      data = r.read()
                  print(f"{full} -> {r.status} {r.headers.get('Content-Type')} {len(data)} bytes head={data[:12].hex()}")
                  name = "site-icon" + ("." + u.rsplit(".", 1)[-1] if "." in u.rsplit("/", 1)[-1] else ".bin")
                  open(name, "wb").write(data)
              except Exception as e:
                  print(f"{full} -> ERR {e}")
          PY
          cat icon-probe.txt >> anv-probe.txt
          ls -la site-icon* 2>/dev/null || true

      - name: Build launcher icons
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          candidates = sorted(glob.glob("site-icon*"), key=os.path.getsize, reverse=True)
          print("candidates:", candidates)
          src = None
          for c in candidates:
              try:
                  im = Image.open(c).convert("RGBA")
                  if im.size[0] >= 32:
                      src = im
                      print("using", c, im.size, im.mode)
                      break
              except Exception as e:
                  print("skip", c, e)
          if src is None:
              raise SystemExit("no usable icon")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          # pad to square with transparent background
          w, h = src.size
          side = max(w, h)
          square = Image.new("RGBA", (side, side), (0, 0, 0, 0))
          square.paste(src, ((side - w) // 2, (side - h) // 2), src)
          for name, px in sizes.items():
              d = f"src/en/anv/res/mipmap-{name}"
              os.makedirs(d, exist_ok=True)
              square.resize((px, px), Image.LANCZOS).save(f"{d}/ic_launcher.png", optimize=True)
              print("wrote", d, px)
          PY
          file src/en/anv/res/mipmap-*/ic_launcher.png 2>/dev/null || true

      - name: Commit probe output
        run: |
          git config user.name "arena-probe"
          git config user.email "probe@arena.local"
          git add anv-probe.txt src/en/anv/res 2>/dev/null || git add anv-probe.txt
          git commit -m "probe-output: filters + icon"
          git push
